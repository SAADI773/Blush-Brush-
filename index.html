<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Startup Animation</title>
<style>
  /* ===== LOADER CSS ===== */
  #loader{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:linear-gradient(135deg,#fff0f5 0%,#ffe4e9 100%);
    display:flex;justify-content:center;align-items:center;
    z-index:9999;
    transition:opacity .8s ease, visibility .8s ease;
  }
  #loader.hidden{opacity:0;visibility:hidden}
  
  .loader-content{text-align:center;animation:bloom 1.5s ease}
  
  .logo-text{
    font-size:3rem;font-weight:700;
    background:linear-gradient(90deg,#d63384,#ff69b4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:20px;letter-spacing:2px;
  }
  
  .loader-bar{
    width:250px;height:3px;background:#f8d7da;
    margin:0 auto 15px;overflow:hidden;border-radius:10px
  }
  .loader-bar::after{
    content:'';display:block;width:40%;height:100%;
    background:#d63384;animation:loading 1.2s infinite ease-in-out
  }
  
  .loader-content p{font-size:.9rem;color:#888;letter-spacing:3px}
  
  @keyframes bloom{
    0%{transform:scale(.8);opacity:0;filter:blur(10px)}
    100%{transform:scale(1);opacity:1;filter:blur(0)}
  }
  @keyframes loading{
    0%{transform:translateX(-100%)}
    50%{transform:translateX(100%)}
    100%{transform:translateX(200%)}
  }
</style>
</head>
<body>

<!-- ===== LOADER HTML ===== -->
<div id="loader">
  <div class="loader-content">
    <h1 class="logo-text">Blush & Brush</h1>
    <div class="loader-bar"></div>
    <p>WHERE BEAUTY MEETS ELEGANCE</p>
  </div>
</div>

<!-- ===== TUMHARA BAKI PAGE YAHAN LIKHO ===== -->
<h1 style="text-align:center;margin-top:100px">Welcome to My Website</h1>

<!-- ===== LOADER JS ===== -->
<script>
window.addEventListener("load",function(){
  setTimeout(function(){
    document.getElementById("loader").classList.add("hidden");
  },2500); // 2.5 sec baad hat jayega
});
</script>

</body>
</html>
