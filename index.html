<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blush & Brush</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400&display=swap');

  body{margin:0; padding:0; background:#fff0f5} /* Light Pink BG */

  #loader{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:radial-gradient(circle at center, #fff0f5 0%, #ffe4e9 100%);
    display:flex;justify-content:center;align-items:center; flex-direction:column;
    z-index:9999;
    overflow:hidden;
    transition: opacity 0.8s ease; /* smooth hide ke liye */
  }
  
  /* Hide class jab timer khatam ho */
  #loader.hide{
    opacity: 0;
    pointer-events: none;
  }
  
  /* ===== GRADIENT CIRCLE LOADER ===== */
  .circle-loader {
    position: relative;
    width: 160px;
    height: 160px;
    margin-bottom: 30px;
    z-index: 2;
  }

  .dot {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform-origin: 0 -65px; /* circle radius */
    animation: rotate 2s linear infinite;
    box-shadow: 0 0 8px currentColor, 0 0 15px currentColor;
  }

  /* 12 Dots with Pink Gradient */
  .dot:nth-child(1)  { transform: rotate(0deg) translateX(65px);   color:#d63384; animation-delay: -0s; }
  .dot:nth-child(2)  { transform: rotate(30deg) translateX(65px);  color:#e754a0; animation-delay: -0.15s; }
  .dot:nth-child(3)  { transform: rotate(60deg) translateX(65px);  color:#ff69b4; animation-delay: -0.3s; }
  .dot:nth-child(4)  { transform: rotate(90deg) translateX(65px);  color:#ff7fb5; animation-delay: -0.45s; }
  .dot:nth-child(5)  { transform: rotate(120deg) translateX(65px); color:#ff94c2; animation-delay: -0.6s; }
  .dot:nth-child(6)  { transform: rotate(150deg) translateX(65px); color:#ffa8ce; animation-delay: -0.75s; }
  .dot:nth-child(7)  { transform: rotate(180deg) translateX(65px); color:#ffb3d1; animation-delay: -0.9s; }
  .dot:nth-child(8)  { transform: rotate(210deg) translateX(65px); color:#ffc0d9; animation-delay: -1.05s; }
  .dot:nth-child(9)  { transform: rotate(240deg) translateX(65px); color:#ffcadf; animation-delay: -1.2s; }
  .dot:nth-child(10) { transform: rotate(270deg) translateX(65px); color:#ffd4e5; animation-delay: -1.35s; }
  .dot:nth-child(11) { transform: rotate(300deg) translateX(65px); color:#ffdeeb; animation-delay: -1.5s; }
  .dot:nth-child(12) { transform: rotate(330deg) translateX(65px); color:#ffe8f1; animation-delay: -1.65s; }

  /* ===== CENTER CONTENT ===== */
  .center-content {
    text-align: center;
    z-index: 2;
  }
  
  .logo-text{
    font-family: 'Playfair Display', serif; 
    font-size:3rem; font-weight:700;
    background:linear-gradient(90deg,#d63384,#ff69b4,#ffb3d1,#ff69b4,#d63384);
    background-size:300% auto; 
    -webkit-background-clip:text; 
    -webkit-text-fill-color:transparent;
    animation:shine 2.5s linear infinite;
    margin:0;
    filter: drop-shadow(0 0 15px rgba(255,105,180,0.4));
  }
  .center-content p{
    font-family: 'Poppins'; 
    font-size:.9rem; 
    color:#c77da0; 
    letter-spacing:4px; 
    margin-top:10px;
    font-weight:300;
  }

  /* ===== FLOATING HEARTS BACKGROUND ===== */
  .heart{
    position:absolute; color:#ffb3d1; opacity:0.2;
    font-size:20px; animation:float 8s infinite ease-in;
    z-index:1; filter: drop-shadow(0 0 5px #ff69b4);
  }

  @keyframes rotate { 
    0% { transform: rotate(0deg) translateX(65px); opacity: 1; }
    100% { transform: rotate(360deg) translateX(65px); opacity: 0.3; }
  }
  @keyframes shine { 0%{background-position:0% center} 100%{background-position:300% center} }
  @keyframes float{
    0%{transform:translateY(100vh) rotate(0deg); opacity:0}
    10%{opacity:0.2}
    90%{opacity:0.2}
    100%{transform:translateY(-100px) rotate(360deg); opacity:0}
  }
</style>
</head>
<body>

<div id="loader">
  <!-- Floating LIGHT PINK Hearts Background -->
  <div class="heart" style="left:10%; font-size:25px; animation-delay:0s">💕</div>
  <div class="heart" style="left:25%; font-size:15px; animation-delay:1s">💕</div>
  <div class="heart" style="left:45%; font-size:22px; animation-delay:2s">💕</div>
  <div class="heart" style="left:65%; font-size:18px; animation-delay:3s">💕</div>
  <div class="heart" style="left:80%; font-size:30px; animation-delay:4s">💕</div>
  <div class="heart" style="left:90%; font-size:16px; animation-delay:5s">💕</div>

  <!-- Gradient Circle Loader -->
  <div class="circle-loader">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <!-- Center Content -->
  <div class="center-content">
    <h1 class="logo-text">Blush & Brush</h1>
    <p>WHERE BEAUTY MEETS ELEGANCE</p>
  </div>
</div>

<!-- ===== 4 SECOND TIMER SCRIPT ===== -->
<script>
  window.addEventListener("load", function() {
    setTimeout(function() {
      document.getElementById("loader").classList.add("hide");
    }, 4000); // 4000ms = 4 seconds
  });
</script>

</body>
</html>
